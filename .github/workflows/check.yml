name: Protocol checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Read the pinned maintenance tool
        id: tool
        run: |
          python - <<'PYTHON'
          import json, os, re
          from pathlib import Path
          lock = json.loads(Path('toolchain.lock.json').read_text())
          assert lock['format_version'] == 1
          assert lock['repository'] == 'https://github.com/XiaTian-X/YunXia.git'
          assert re.fullmatch(r'[0-9a-f]{40}', lock['commit'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('commit=' + lock['commit'] + '\n')
          PYTHON
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: XiaTian-X/YunXia
          ref: ${{ steps.tool.outputs.commit }}
          path: .yunxia-tool
          persist-credentials: false
      - name: Validate protocol data and preserved Git history
        run: python -B .yunxia-tool/tooling/yunxia.py check --repository "$GITHUB_WORKSPACE"
      - run: git diff --exit-code
